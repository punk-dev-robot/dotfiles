[mcp_servers.basic-memory]
command = "uvx"
args = ["basic-memory", "mcp"]

[mcp_servers.basic-memory.env]
LOG_LEVEL = "warn"

[mcp_servers.exa]
command = "npx"
args = ["-y", "exa-mcp-server@latest", "--tools=web_search_exa,research_paper_search,company_research,crawling,competitor_finder,linkedin_search,wikipedia_search_exa,github_search"]

[mcp_servers.exa.env]
EXA_API_KEY = "PLACEHOLDER_!op read 'op://Homelab/Exa-MCP/password'"

[mcp_servers.firecrawl]
command = "npx"
args = ["-y", "firecrawl-mcp"]

[mcp_servers.firecrawl.env]
FIRECRAWL_API_URL = "http://10.10.10.51:3002"

[mcp_servers.serena]
command = "serena"
args = ["start-mcp-server", "--context=codex", "--project-from-cwd"]

[mcp_servers.codebase-retrieval]
command = "auggie"
args = ["--mcp", "--mcp-auto-workspace"]


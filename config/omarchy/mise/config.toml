[tools]
checkov = "latest"
claude = "latest"
codex = "latest"
copilot = "latest"
gh = "latest"
hadolint = "latest"
node = "26"  # major pin: `mise up` follows patch/minor
opa = "latest"
opencode = "latest"
pi = "latest"

[settings.upgrade]
auto_prune = false

[settings]
idiomatic_version_file_enable_tools = ["node"]  # honour .nvmrc / .node-version (off by default since mise 2025.10)

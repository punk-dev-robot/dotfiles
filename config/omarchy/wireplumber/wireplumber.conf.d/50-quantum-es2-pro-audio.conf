# PreSonus Quantum ES 2 (194f:0609): use the Pro Audio profile (raw AUX channels, all 6 inputs,
# no channelmix/upmix) instead of the auto-picked ACP "Surround 4.0 + 2.1". Audible outs = AUX0/1
# (Main + Phones mirrored); AUX2/3 are silent. Rode = AUX0 in. docs/reference/soundid-migration.md
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.usb-PreSonus_Quantum_ES_2.*" } ]
    actions = { update-props = { device.profile = "pro-audio" } }
  }
]

# Hide mics that would otherwise steal the default source on every PipeWire restart
# (pipewire-pulse module-switch-on-connect makes the last-enumerated input win).
# Kept: Rode on Quantum ES 2 (input 1), webcam C920 as fallback. See plans/soundid-migration.md.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input.usb-Generic_USB_Audio_.*" }   # Fifine, unused
      { node.name = "~alsa_input.pci-.*analog-stereo" }        # motherboard jack, unused
    ]
    actions = { update-props = { node.disabled = true } }
  }
]

# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# KUB-18: shared MCP gateway.
# Run: op run --account my.1password.com --env-file=config/shared/claude/secrets.env \
#   -- agentgateway -f <this file>
#
# /mcp       — multiplexed key-auth upstreams (gateway holds credentials)
# /logfire, /newrelic, /notion — mcp-remote stdio bridges: OAuth done ONCE
#   gateway-side (browser grant on first use), tokens cached+refreshed at
#   ~/.mcp-auth (0600), shared by all agents. Naive passthrough fails: strict
#   MCP SDK clients reject RFC 9728 resource mismatch (upstream resource !=
#   gateway URL).
#
# NOTE: manage this file by hand; the admin UI (localhost:15000/ui) overwrites
# it and wipes comments. UI "MCP/LLM gateway" cards track the simplified
# top-level mcp:/llm: sections only — routes below are the real config.
gateways:
  default:
    port: 3000
    protocol: HTTP

routes:
  - name: mcp-multiplexed
    matches:
      - path:
          pathPrefix: /mcp
    backends:
      - mcp:
          targets:
            - name: exa
              mcp:
                host: https://mcp.exa.ai/mcp
              policies:
                backendAuth:
                  key: "$EXA_API_KEY"
            - name: firecrawl
              mcp:
                host: https://mcp.firecrawl.dev/v2/mcp
              policies:
                backendAuth:
                  key: "$FIRECRAWL_API_KEY"
            - name: context7
              mcp:
                host: https://mcp.context7.com/mcp
              policies:
                backendAuth:
                  key:
                    value: "$CONTEXT7_API_KEY"
                    location:
                      header:
                        name: CONTEXT7_API_KEY
            - name: linear
              mcp:
                host: https://mcp.linear.app/mcp
              policies:
                backendAuth:
                  key: "$LINEAR_API_KEY"
  - name: logfire
    matches:
      - path:
          pathPrefix: /logfire
    backends:
      - mcp:
          targets:
            - name: logfire
              stdio:
                cmd: npx
                args: ["-y", "mcp-remote@0.8.3", "https://logfire-eu.pydantic.dev/mcp"]
  - name: newrelic
    matches:
      - path:
          pathPrefix: /newrelic
    backends:
      - mcp:
          targets:
            - name: newrelic
              stdio:
                cmd: npx
                args: ["-y", "mcp-remote@0.8.3", "https://mcp.eu.newrelic.com/mcp/"]
  - name: notion
    matches:
      - path:
          pathPrefix: /notion
    backends:
      - mcp:
          targets:
            - name: notion
              stdio:
                cmd: npx
                args: ["-y", "mcp-remote@0.8.3", "https://mcp.notion.com/mcp"]
  - name: slack
    matches:
      - path:
          pathPrefix: /slack
    backends:
      - mcp:
          targets:
            - name: slack
              stdio:
                cmd: npx
                args:
                  - "-y"
                  - "mcp-remote@0.8.3"
                  - "https://mcp.slack.com/mcp"
                  - "3118"
                  - "--static-oauth-client-info"
                  - '{"client_id":"2966739332885.11949201186418","client_secret":"$SLACK_MCP_CLIENT_SECRET"}'
                  - "--static-oauth-client-metadata"
                  - '{"scope":"canvases:read canvases:write channels:history channels:read chat:write groups:history search:read.private search:read.public users:read","token_endpoint_auth_method":"client_secret_post"}'
                  - "--authorize-param"
                  - "user_scope=canvases:read,canvases:write,channels:history,channels:read,chat:write,groups:history,search:read.private,search:read.public,users:read"

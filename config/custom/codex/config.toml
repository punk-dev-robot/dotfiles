# dotter TEMPLATE (config/custom/codex/config.toml) -> ~/.config/codex/config.toml is a rendered real file:
# codex self-writes (model, model_reasoning_effort, trust, plugin state) land there, never in the repo (KUB-124).
# App-managed keys are deliberately absent here; host paths come from .dotter/<host>.toml vars.
personality = "pragmatic"
notify = [
  "{{home_dir}}/.config/codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended"
]

[mcp_servers.tessl]
command = "tessl"
args = ["mcp", "start"]

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "{{home_dir}}/dotfiles", "{{home_dir}}/dev", "{{home_dir}}/Documents/notes"]

[mcp_servers.node_repl]
args = []
command = "{{chatgpt_resources}}/cua_node/bin/node_repl"
startup_timeout_sec = 120

[mcp_servers.node_repl.env]
NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
NODE_REPL_NODE_MODULE_DIRS = "{{chatgpt_resources}}/cua_node/lib/node_modules"
NODE_REPL_NODE_PATH = "{{chatgpt_resources}}/cua_node/bin/node"
NODE_REPL_TRUSTED_CODE_PATHS = "{{home_dir}}/.config/codex:{{chatgpt_resources}}/cua_node/lib/node_modules"
CODEX_HOME = "{{home_dir}}/.config/codex"
BROWSER_USE_AVAILABLE_BACKENDS = "chrome,iab"
BROWSER_USE_TINYSKY_ENABLED = "1"
NODE_REPL_INSTRUCTIONS_USE_CASE_BROWSER = ""
NODE_REPL_INSTRUCTIONS_USE_CASE_CHROME = ""
BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
BROWSER_USE_CODEX_APP_VERSION = "26.911.61220"
NODE_REPL_TRUSTED_SERVICES = '{"browser":"{{home_dir}}/.config/codex/plugins/cache/openai-bundled/browser/26.911.61220/scripts/browser-service.mjs"}'
CODEX_CLI_PATH = "{{chatgpt_resources}}/codex"

[mcp_servers.workshop]
command = "{{home_dir}}/.raindrop/bin/raindrop"
args = ["workshop", "mcp"]

[mcp_servers.gateway]
url = "http://localhost:3000/mcp"

[mcp_servers.logfire]
url = "http://localhost:3000/logfire"

[mcp_servers.notion]
url = "http://localhost:3000/notion"

[mcp_servers.newrelic]
url = "http://localhost:3000/newrelic"

[mcp_servers.slack]
url = "http://localhost:3000/slack"

[projects."{{home_dir}}/swapc/window-shop-monorepo"]
trust_level = "trusted"

[projects."{{home_dir}}/dotfiles"]
trust_level = "trusted"

[projects."{{home_dir}}/dev/swapc/window-shop-monorepo"]
trust_level = "trusted"

[projects."{{home_dir}}/Documents/Codex/2026-05-27/i-want-to-set-up-a"]
trust_level = "trusted"

[projects."{{home_dir}}/dev/swapc/shopai"]
trust_level = "trusted"

[projects."{{home_dir}}/Library/Application Support/com.conductor.app/bin"]
trust_level = "trusted"

[desktop]
conversationDetailMode = "STEPS_COMMANDS"
default-service-tier = "priority"
followUpQueueMode = "queue"
dock-icon-preference = "codex-system"

[features]
hooks = true
js_repl = false

[marketplaces.openai-bundled]
source_type = "local"
source = "{{home_dir}}/.config/codex/.tmp/bundled-marketplaces/openai-bundled"

[marketplaces.openai-primary-runtime]
source_type = "local"
source = "{{home_dir}}/.cache/codex-runtimes/codex-primary-runtime/plugins/openai-primary-runtime"

[hooks.state."{{home_dir}}/.config/codex/hooks.json:stop:0:0"]
trusted_hash = "sha256:a69432c39471bacb24dbef7d59ef4a8ca451184d096b6588c41f7e70d825c011"

[hooks.state."{{home_dir}}/dev/swapc/shopai/.codex/hooks.json:pre_tool_use:0:0"]
trusted_hash = "sha256:9080e32b83e1cac643899f11433f5b9ea6a5c03cfdde013224c00150eb95eca8"

[hooks.state."{{home_dir}}/dev/swapc/shopai/.codex/hooks.json:post_tool_use:0:0"]

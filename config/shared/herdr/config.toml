onboarding = false

[theme]
name = "catppuccin"

auto_switch = false
[theme.custom]
panel_bg = "reset"
accent = "#fab387"

[terminal]
shell_mode = "auto"
# Pin the pane shell to zsh (PATH-resolved, works on Arch + macOS). Without this,
# default_shell = "" falls back to the herdr server's inherited $SHELL, so a
# server started from a bash terminal spawns every pane as bash.
default_shell = "zsh"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+shift+o"
copy_mode = "prefix+enter"
resize_mode = "prefix+alt+r"

# workspace_picker = "prefix+o"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
previous_workspace = "prefix+k"
next_workspace = "prefix+j"
switch_workspace = "prefix+shift+1..9"
close_workspace = "prefix+alt+d"
new_worktree = ""

new_tab = ["prefix+n", "prefix+c"]
rename_tab = "prefix+r"
previous_tab = ["prefix+[", "ctrl+shift+["]
next_tab = ["prefix+]", "ctrl+shift+]"]
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+q"
move_tab_previous = "prefix+shift+["
move_tab_next = "prefix+shift+]"

focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

# last_pane = "prefix+tab"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+q"
zoom = "prefix+z"
cycle_pane_next = ""
cycle_pane_previous = ""

toggle_sidebar = "prefix+shift+s"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (nvim/herdr)"

[[keys.command]]

[ui]
sidebar_width = 32
sidebar_min_width = 18
sidebar_max_width = 60
sidebar_start_collapsed = false
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
pane_borders = "always"
pane_gaps = true
pane_scrollbars = false
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"
window_title = "{hostname}: {workspace} · {tab}"
status_indicators = "symbols"
prompt_new_workspace_name = true
tab_bar_position = "bottom"

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "agent", bold = true },
    { token = "state_text", rules = [
      { starts_with = "blocked", fg = "#f38ba8", bold = true },
      { starts_with = "working", fg = "#f9e2af" },
      { starts_with = "done", fg = "#a6e3a1" },
      # 0.9.1 supports { hide = true } here; needs a 0.9.1 server (0.9.0 drops all of [ui] on it)
      { starts_with = "idle", dim = true },
    ] },
  ],
  [
    { token = "tab", dim = false },
  ],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true },
  ],
  [
    { token = "branch", rules = [
      { equals = "main", dim = true },
      { equals = "master", dim = true },
    ] },
    "git_status",
  ],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[experimental]
# kitty_graphics moved to terminal.kitty_graphics in 0.9.0 and defaults to true
switch_ascii_input_source_in_prefix = false
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "pi", "codex"]

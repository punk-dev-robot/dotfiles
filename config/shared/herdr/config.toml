onboarding = false

[theme]
name = "catppuccin"

auto_switch = false
[theme.custom]
panel_bg = "reset"
accent = "#fab387"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
help = "prefix+?"
settings = "prefix+s"
detach = "prefix+d"
reload_config = "prefix+shift+r"
open_notification_target = "prefix+shift+o"
copy_mode = "prefix+enter"
resize_mode = "prefix+alt+r"

workspace_picker = "prefix+o"
navigate_workspace_up = "up"
navigate_workspace_down = "down"
switch_workspace = "prefix+shift+1..9"
close_workspace = "prefix+alt+d"
new_worktree = ""

new_tab = "prefix+t"
rename_tab = "prefix+r"
previous_tab = ["prefix+[", "ctrl+shift+["]
next_tab = ["prefix+]", "ctrl+shift+]"]
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+q"

focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

last_pane = "prefix+tab"
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"
close_pane = "prefix+q"
zoom = "prefix+z"
cycle_pane_next = ""
cycle_pane_previous = ""

toggle_sidebar = "prefix+b"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (nvim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down (nvim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up (nvim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right (nvim/herdr)"

[[keys.command]]
key = "ctrl+left"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left (nvim/herdr)"

[[keys.command]]
key = "ctrl+down"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down (nvim/herdr)"

[[keys.command]]
key = "ctrl+up"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up (nvim/herdr)"

[[keys.command]]
key = "ctrl+right"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right (nvim/herdr)"

[[keys.command]]
key = "prefix+shift+g"
type = "plugin_action"
command = "worktrunk.open"
description = "switch or create worktree from default branch"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "worktrunk.open-current"
description = "create worktree from current branch"

[[keys.command]]
key = "prefix+shift+d"
type = "plugin_action"
command = "worktrunk.remove"
description = "remove worktree"

[[keys.command]]
key = "prefix+x"
type = "plugin_action"
command = "termscope.open-links"
description = "open link from visible terminal output"

[[keys.command]]
key = "prefix+shift+x"
type = "plugin_action"
command = "termscope.open"
description = "open target from visible terminal output"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer"
description = "open file viewer"

[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-file-viewer.open-file-viewer-tab"
description = "open file viewer tab"

[[keys.command]]
key = "prefix+v"
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
description = "toggle reviewr sidebar"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "clear active pane"

[[keys.command]]
key = "prefix+p"
type = "popup"
command = 'exec "${SHELL:-sh}"'
description = "open scratch terminal"
width = "80%"
height = "80%"

[ui]
sidebar_width = 30
sidebar_min_width = 22
sidebar_max_width = 60
sidebar_start_collapsed = true
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 1
rows = [
  [
    "state_icon",
    { token = "agent", bold = true },
    "state_text",
  ],
  [
    "workspace",
    "tab",
    { token = "terminal_title_stripped", fg = "#89b4fa", dim = true },
  ],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [
    "state_icon",
    { token = "workspace", bold = true },
  ],
  [
    "branch",
    "git_status",
  ],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[experimental]
switch_ascii_input_source_in_prefix = false

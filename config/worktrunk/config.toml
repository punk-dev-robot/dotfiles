# Worktrunk user config
# Docs: https://worktrunk.dev/config/
# Scope: personal, never committed.

# ----------------------------------------------------------------------------
# LLM commit message generation
# Used by `wt merge`, `wt step commit`, `wt step squash`.
# Pipes the rendered template to Claude Code (haiku) on stdin.
# ----------------------------------------------------------------------------
[commit.generation]
# `CLAUDECODE=` removes the nesting guard so this works inside Claude Code sessions.
# `--no-session-persistence` keeps commit conversations out of `claude --continue`.
# All tools/skills/settings/system-prompt disabled for fast text-only output.
# command = "CLAUDECODE= MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --disable-slash-commands --setting-sources='' --system-prompt=''"
command = "codex exec -m gpt-5.4-mini -c model_reasoning_effort='low' -c system_prompt='' --sandbox=read-only --json - | jq -sr '[.[] | select(.item.type? == \"agent_message\")] | last.item.text'"

# Conventional Commits template tuned for the swap repos
# Branch convention: agi-NNNN-kebab-description -> commit scope AGI-NNNN.
template = """
Write commit messages terse and exact. Conventional Commits format. No fluff. Why over what.

## Rules

**Subject line:**
- `<type>(<scope>): <imperative summary>` — `<scope>` optional
- Types: `feat`, `fix`, `refactor`, `perf`, `docs`, `test`, `chore`, `build`, `ci`, `style`, `revert`
- Imperative mood: "add", "fix", "remove" — not "added", "adds", "adding"
- ≤50 chars when possible, hard cap 72
- No trailing period
- Match project convention for capitalization after the colon

**Body (only if needed):**
- Skip entirely when subject is self-explanatory
- Add body only for: non-obvious *why*, breaking changes, migration notes, linked issues
- Wrap at 72 chars
- Bullets `-` not `*`
- Reference issues/PRs at end: `Closes #42`, `Refs #17`

**What NEVER goes in:**
- "This commit does X", "I", "we", "now", "currently" — the diff says what
- "As requested by..." — use Co-authored-by trailer
- "Generated with Claude Code" or any AI attribution
- Emoji (unless project convention requires)
- Restating the file name when scope already says it

## Examples

Diff: new endpoint for user profile with body explaining the why
- ❌ "feat: add a new endpoint to get user profile information from the database"
- ✅
  ```
  feat(api): add GET /users/:id/profile

  Mobile client needs profile data without the full user payload
  to reduce LTE bandwidth on cold-launch screens.

  Closes #128
  ```

Diff: breaking API change
- ✅
  ```
  feat(api)!: rename /v1/orders to /v1/checkout

  BREAKING CHANGE: clients on /v1/orders must migrate to /v1/checkout
  before 2026-06-01. Old route returns 410 after that date.
  ```

## Auto-Clarity

Always include body for: breaking changes, security fixes, data migrations, anything reverting a prior commit. Never compress these into subject-only — future debuggers need the context.
"""

#
# Squash template: same rules, summarises N commits into one.
squash-template = """
You are squashing {{ commits | length }} commits into ONE Conventional Commits message.

Output format (and nothing else):
  <type>(<scope>): <subject>

  <optional body, blank line above, wrapped at 72 chars>

Rules:
- Output ONLY the commit message text. No code fences, no preamble, no commentary.
- Subject: imperative mood, lowercase first word, no trailing period, <= 72 chars.
- type ∈ { feat, fix, docs, style, refactor, perf, test, build, ci, chore }.
- Scope: extract the ticket id from the branch name "{{ branch }}".
  - If it matches /agi-\\d+/i, set scope to the uppercased id (e.g. AGI-3420).
  - Otherwise omit scope entirely: "<type>: <subject>".
- Body: short bullet list summarising the squashed commits, only if it adds value.
- Do not invent a co-author trailer, ticket id, or PR number.

Branch: {{ branch }}
Target: {{ target_branch }}

Commits being squashed:
{% for c in commits %}- {{ c }}
{% endfor %}
Diff stat:
{{ git_diff_stat }}

Diff:
{{ git_diff }}
"""

[aliases]
# Drop worktrees + branches integrated into develop (squash-merge aware).
# Usage:
#   wt clean              remove all merged worktrees (>=1h old)
#   wt clean --dry-run    preview only
#   wt clean --min-age=0s no age guard
prune = "wt step prune {{ args }}"

# Open a worktree for a GitHub PR. Branch is created tracking the PR head.
# Usage: wt pr 547
pr = "wt switch --create pr-{{ args[0] }} --base pr:{{ args[0] }}"

# Sanity check: shows worktree status + latest origin commit on default branch.
# Useful before creating a new worktree to confirm origin is fresh.
status = "wt list --full && git -C {{ primary_worktree_path }} log --oneline -1 origin/{{ default_branch }}"

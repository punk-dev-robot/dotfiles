[bindings]
keys = [
  { key = "c", with = "control | shift", action = "Copy" },
  { key = "v", with = "control | shift", action = "Paste" },
  { key = "Return", with = "shift", esc = "\u001b[13;2u" },
]

[shell]
program = "/opt/homebrew/bin/tmux"
args = ["new-session", "-A", "-s", "dropterm"]

[navigation]
mode = "Plain"

[fonts]
size = 18

[fonts.regular]
regular = "Anka/Coder"

[[fonts.extras]]
family = "Symbols Nerd Font Mono"

# [fonts.regular]
# family = "MesloLGL Nerd Font Mono"

[window]
opacity = 0.85
width = 1920
height = 1200

[renderer]
performance = "High"
backend = "Automatic"
# Built-in: NewPixieCrt, fubax_vr (case-sensitive); GL backend doesn't support filters
# Custom .slangp paths also supported: "/path/to/shader.slangp"
filters = ["/Users/kuba.gaj/dev/oss/slang-shaders/crt/shaders/crt-aperture.slang"]
# lighter — barely visible:
# filters = ["/Users/kuba.gaj/dev/oss/slang-shaders/crt/shaders/crt-frutbunn.slang"]
# moderate — good balance:
# filters = ["/Users/kuba.gaj/dev/oss/slang-shaders/crt/shaders/crt-cgwg-fast.slang"]
# heavier:
# filters = ["/Users/kuba.gaj/dev/oss/slang-shaders/crt/shaders/crt-aperture.slang"]
# filters = ["NewPixieCrt"]


[colors]
background = '#24273a'
foreground = '#cad3f5'
selection-background = '#5b6078'
selection-foreground = '#cad3f5'
cursor = '#f4dbd6'
black = '#494d64'
red = '#ed8796'
green = '#a6da95'
yellow = '#eed49f'
blue = '#8aadf4'
magenta = '#f5bde6'
cyan = '#8bd5ca'
white = '#a5adcb'
light_black = '#5b6078'
light_red = '#ec7486'
light_green = '#8ccf7f'
light_yellow = '#e1c682'
light_blue = '#78a1f6'
light_magenta = '#f2a9dd'
light_cyan = '#63cbc0'
light_white = '#b8c0e0'


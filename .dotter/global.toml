[settings]
default_target_type = "symbolic"

# config/ holds: shared/ and mac/ (plain per-host dirs, ~/.config/*, one-line recursive map),
# custom/ (needs special handling: templating, single-dir symlink, or a target outside
# ~/.config; listed individually below), omarchy/ (Omarchy desktop overrides, listed under
# [omarchy.files] below), and .disabled/ (parked configs, not deployed — not referenced here).
# Add a plain config = drop the dir into shared/mac, no edit here.
# Hosts pick packages in .dotter/<hostname>.toml: macOS=["macos"], Linux=["omarchy", "omarchy-system"].
[base.files]
"local" = "~/.local"
"config/shared" = "~/.config"
# KUB-129: colima context is mac-only; linux talks to the local dockerd (default context).
"config/shared/docker/config.json" = { target = "~/.config/docker/config.json", type = "template" }
"config/custom/ghostty" = { target = "~/.config/ghostty", type = "template" }
"config/custom/nvim" = { target = "~/.config/nvim", type = "symbolic", recurse = false }
"config/custom/git/gitconfig" = { target = "~/.gitconfig", type = "template" }
"config/custom/git/gitignore" = "~/.gitignore"
"config/custom/ssh" = { target = "~/.ssh", type = "template" }
"config/custom/zsh" = "~/.config/zsh"
"config/custom/zsh/.zshenv" = "~/.zshenv"
"config/custom/.markdownlint.jsonc" = "~/.markdownlint.jsonc"
"config/custom/pnpm/global-packages.txt" = "~/.config/pnpm/global-packages.txt"
# Vicinae: settings.json stays local (GUI-written, secrets); it imports this shared template. Extension list is reference only.
"config/custom/vicinae/dotfiles.json" = { target = "~/.config/vicinae/dotfiles.json", type = "template" }
"config/custom/vicinae/extensions.txt" = "~/.config/vicinae/extensions.txt"
"config/custom/pi/agent" = "~/.config/pi/agent"
# @firstpick/pi-extension-tools (/tools) resource defaults; path via PI_WEBUI_SETTINGS_FILE in .zshenv
"config/custom/pi/webui/settings.json" = "~/.config/pi/webui/settings.json"
# tessl global skill manifest (which plugins/skills are installed; excludes derived from it).
# After changing: tessl install -g ... then tessl-cock-prefix. Do NOT run tessl inside ~/.tessl.
"config/custom/tessl/tessl.json" = "~/.tessl/tessl.json"
# KUB-124: apps that rewrite their own config (codex: model/trust/plugins; claude: "model") — deployed as
# templates = rendered real files, so self-writes stay in ~/.config and never dirty the repo. App-managed keys
# are dropped from the repo copies. codex paths use {{home_dir}} + {{chatgpt_resources}} (per-host vars).
# The rest of config/shared/{codex,claude} (hooks, skills, CLAUDE.md…) stays symlinked via the recursive map.
"config/custom/codex/config.toml" = { target = "~/.config/codex/config.toml", type = "template" }
"config/custom/claude/settings.json" = { target = "~/.config/claude/settings.json", type = "template" }

# own agent skills (punk-*); deployed next to tessl__* symlinks managed by tessl-cock-prefix.
"config/custom/agents/skills" = "~/.agents/skills"

# ─── macOS (AeroSpace stack) ───
[macos]
depends = ["base"]

[macos.files]
"config/mac" = "~/.config"
"config/custom/karabiner" = { target = "~/.config/karabiner", type = "symbolic", recurse = false }
"config/custom/a-bar/a-barrc" = "~/.a-barrc"
"config/custom/hammerspoon" = { target = "~/.hammerspoon", type = "symbolic", recurse = false }
# KUB-144: borders/colima launchd agents parked in config/.disabled/launchagents (mac = headless herdr server; `mac-desktop` / `colima start` on demand).
"config/custom/launchagents/com.user.agentgateway.plist" = { target = "~/Library/LaunchAgents/com.user.agentgateway.plist", type = "template" }
"config/custom/agentgateway/config.yaml" = { target = "~/.config/agentgateway/config.yaml", type = "template" }

# ─── Omarchy = base + reviewed desktop overrides (per-file, listed under [omarchy.files]). ───
[omarchy]
depends = ["base"]

[omarchy.files]
# KUB-79: agentgateway as a systemd user unit. config.yaml is a template (work routes are mac-only).
"config/custom/agentgateway/config.yaml" = { target = "~/.config/agentgateway/config.yaml", type = "template" }
"config/omarchy/systemd/agentgateway.service" = "~/.config/systemd/user/agentgateway.service"
# mise tools (node, AI CLIs, hadolint/opa/checkov); `omarchy-update` runs `mise up`
"config/omarchy/mise/config.toml" = "~/.config/mise/config.toml"
# KUB-122: own maintenance timers (omarchy has none besides snapper-cleanup); post_deploy enables them.
"config/omarchy/systemd/easyeffects.service" = "~/.config/systemd/user/easyeffects.service" # bound to pipewire.service (audio correction)
"config/omarchy/systemd/btrfs-space-monitor.service" = "~/.config/systemd/user/btrfs-space-monitor.service"
"config/omarchy/systemd/btrfs-space-monitor.timer" = "~/.config/systemd/user/btrfs-space-monitor.timer"
"config/omarchy/systemd/git-maintenance-sync.service" = "~/.config/systemd/user/git-maintenance-sync.service"
"config/omarchy/systemd/git-maintenance-sync.timer" = "~/.config/systemd/user/git-maintenance-sync.timer"
"config/omarchy/systemd/screenshot-cleanup.service" = "~/.config/systemd/user/screenshot-cleanup.service"
"config/omarchy/systemd/screenshot-cleanup.timer" = "~/.config/systemd/user/screenshot-cleanup.timer"
# KUB-102: Hyprland override points. omarchy-refresh-hyprland targets → dotter owns them; omarchy's originals
# are kept as ~/.config/hypr/*.omarchy-bak. hyprland.lua + .luarc.json are verbatim omarchy copies.
"config/omarchy/hypr" = "~/.config/hypr"
# KUB-111/118: omarchy user override points, per-file symlinks into ~/.config/omarchy (omarchy's own dirs stay).
#   shell.json (bar layout, idle; original: shell.json.omarchy-bak), shell.toml (font base-size),
#   themed/*.tpl (rendered on theme-set), hooks/theme-set.d/zen.
# shell.{json,toml} are COPIES (template type), not symlinks: omarchy-shell persists its in-memory config
# with an atomic write (tmp + rename) and `omarchy bar|plugin|display text size` do `mv` — both replace a
# symlink with a real file. Pull UI/CLI edits back with `omarchy-shell-pull`; post_deploy reloads the shell.
# See docs/troubleshooting/omarchy-refresh-writes-through-symlinks.md.
"config/omarchy/omarchy" = "~/.config/omarchy"
"config/omarchy/omarchy/shell.json" = { target = "~/.config/omarchy/shell.json", type = "template" }
"config/omarchy/omarchy/shell.toml" = { target = "~/.config/omarchy/shell.toml", type = "template" }
# KUB-127 (KUB-93 verdicts): app flags & misc. chromium-flags.conf is an omarchy refresh target (original:
# ~/.config/chromium-flags.conf.omarchy-bak). mimeapps.list stays unmanaged (runtime churn) — reference copy only.
"config/omarchy/chromium-flags.conf" = "~/.config/chromium-flags.conf"
"config/omarchy/voxtype/config.toml" = "~/.config/voxtype/config.toml"
"config/omarchy/tridactyl/tridactylrc" = "~/.config/tridactyl/tridactylrc"
"config/omarchy/1Password/ssh/agent.toml" = "~/.config/1Password/ssh/agent.toml"
"config/omarchy/spotify-launcher.conf" = "~/.config/spotify-launcher.conf"
# KUB-111 follow-up: imv keybinds; Ctrl+E annotates in satty (omarchy default calls the dropped tensaku).
"config/omarchy/imv/config" = "~/.config/imv/config"
# KUB-122: udiskie device rules (omarchy autostarts udiskie; config.yml is read regardless of its flags).
"config/omarchy/udiskie" = "~/.config/udiskie"
"config/omarchy/wireplumber" = "~/.config/wireplumber" # pro-audio profile + disable unused mics (plans/soundid-migration.md)
"config/omarchy/easyeffects" = "~/.local/share/easyeffects" # 8.x preset dir; it migrates+trashes ~/.config/easyeffects/{input,output}

# ─── Omarchy system files (/etc, root-owned copies). KUB-129 / verdicts KUB-94 / ADR 0003.
#     Per-file ownership: each entry below is a copy (template type), not a symlink. Pacman-owned
#     targets (earlyoom, btrfsmaintenance, daemon.json) may get *.pacnew on upgrades — merge into repo.
#     Originals: /etc/<file>.omarchy-bak. Deploy needs sudo (owner types it). ───
[omarchy-system]
depends = ["omarchy"]

[omarchy-system.files]
"etc/1password/custom_allowed_browsers" = { target = "/etc/1password/custom_allowed_browsers", type = "template", owner = "root" }
"etc/btrbk/btrbk.conf" = { target = "/etc/btrbk/btrbk.conf", type = "template", owner = "root" }
"etc/default/btrfsmaintenance" = { target = "/etc/default/btrfsmaintenance", type = "template", owner = "root" }
"etc/default/earlyoom" = { target = "/etc/default/earlyoom", type = "template", owner = "root" }
"etc/docker/daemon.json" = { target = "/etc/docker/daemon.json", type = "template", owner = "root" }
"etc/systemd/system/mnt-btr_pool.mount" = { target = "/etc/systemd/system/mnt-btr_pool.mount", type = "template", owner = "root" }
"etc/systemd/system/btrbk.service" = { target = "/etc/systemd/system/btrbk.service", type = "template", owner = "root" }
"etc/systemd/system/btrbk.timer" = { target = "/etc/systemd/system/btrbk.timer", type = "template", owner = "root" }
"etc/systemd/system/notify-failure@.service" = { target = "/etc/systemd/system/notify-failure@.service", type = "template", owner = "root" }
"etc/systemd/system/notify-success@.service" = { target = "/etc/systemd/system/notify-success@.service", type = "template", owner = "root" }
"etc/systemd/system/containerd-cleanup.service" = { target = "/etc/systemd/system/containerd-cleanup.service", type = "template", owner = "root" }
"etc/systemd/system/containerd-cleanup.timer" = { target = "/etc/systemd/system/containerd-cleanup.timer", type = "template", owner = "root" }

[settings]
default_target_type = "symbolic"

# config/ holds exactly four dirs:
#   shared/  → ~/.config/*   plain configs, every host   (one-line recursive map)
#   linux/   → ~/.config/*   plain Arch-only configs     (one-line recursive map)
#   mac/     → ~/.config/*   plain macOS-only configs    (one-line recursive map)
#   custom/  → configs needing special handling (templating, single-dir symlink,
#              or a target outside ~/.config); listed individually below.
# Add a plain config = drop the dir into shared/linux/mac, no edit here.
# Hosts pick packages in .dotter/<hostname>.toml: macOS=["macos"], Arch=["arch"].
[base.files]
"local" = "~/.local"
"config/shared" = "~/.config"
"config/custom/ghostty" = { target = "~/.config/ghostty", type = "template" }
"config/custom/tmux" = { target = "~/.config/tmux", type = "template" }
"config/custom/nvim" = { target = "~/.config/nvim", type = "symbolic", recurse = false }
"config/custom/git/gitconfig" = { target = "~/.gitconfig", type = "template" }
"config/custom/git/gitignore" = "~/.gitignore"
"config/custom/ssh" = { target = "~/.ssh", type = "template" }
"config/custom/zsh" = "~/.config/zsh"
"config/custom/zsh/.zshenv" = "~/.zshenv"
"config/custom/.markdownlint.jsonc" = "~/.markdownlint.jsonc"
"config/custom/pi/agent" = "~/.config/pi/agent"
# piewf's role scanner can't see per-file symlinks (Dirent.isFile() false; vekexasia/pi-extensible-workflows#193),
# so deploy roles as template COPIES instead of symlinks. Edit in repo, then redeploy.
"config/custom/pi/agent/pi-extensible-workflows/roles" = { target = "~/.config/pi/agent/pi-extensible-workflows/roles", type = "template" }
# agents/*.md frontmatter carries handlebars vars too, so the same #193 template-copy
# treatment applies (the parent agent dir stays a plain symlink).
"config/custom/pi/agent/agents" = { target = "~/.config/pi/agent/agents", type = "template" }
# pi-claude-code-ui reads its own settings from ~/.pi/settings.json (~/.pi == ~/.config/pi)
"config/custom/pi/settings.json" = "~/.config/pi/settings.json"

# Shared tool groups for piewf role frontmatter (roles/*.md are handlebars templates).
# piewf roles: `tools:` fully replaces the inherited toolset (no merge), so shared
# groups live here; `disabledAgentResources` DOES merge (global settings.json first,
# role patterns appended, last-match-wins). Inspect with: npx -y @piewf/cli doctor --role <role>
# See docs/reference/piewf-role-config.md.
[base.variables]
# No spaces after commas: subagent frontmatter takes `tools: a,b,c` verbatim.
pi_tools_core = "read,grep,find,ls"
pi_tools_cymbal = "cymbal_search,cymbal_show,cymbal_refs"
pi_tools_edit = "write,replace,undo_last_replace"
pi_tools_cymbal_deep = "cymbal_investigate,cymbal_map,cymbal_outline,cymbal_structure,cymbal_context"
pi_tools_cymbal_review = "cymbal_diff,cymbal_changed,cymbal_impact"
# advisor tools require pi-advisor-flow re-enabled for agents in piewf settings.json extensions
pi_tools_advisor = "ask_advisor,record_advisor_outcome"
pi_tools_ctx = "ctx_execute,ctx_batch_execute,ctx_search"

# Model + thinking level per paired concept (subagent agents/<name>.md and piewf
# roles/<name>.md read the same pair).
pi_model_recon = "anthropic/claude-sonnet-5"
pi_think_recon = "low"
pi_model_researcher = "anthropic/claude-opus-5"
pi_think_researcher = "medium"
pi_model_dev = "anthropic/claude-opus-5"
pi_think_dev = "medium"
pi_model_impl = "anthropic/claude-sonnet-5"
pi_think_impl = "medium"
pi_model_reviewer = "anthropic/claude-fable-5"
pi_think_reviewer = "high"
pi_model_tests = "anthropic/claude-sonnet-5"
pi_think_tests = "medium"
pi_model_comms = "anthropic/claude-sonnet-5"
pi_think_comms = "medium"

# ─── Linux desktop (Hyprland stack) ───
[linux.files]
"config/linux" = "~/.config"

# ─── macOS (AeroSpace stack) ───
[macos]
depends = ["base"]

[macos.files]
"config/mac" = "~/.config"
"config/custom/karabiner" = { target = "~/.config/karabiner", type = "symbolic", recurse = false }
"config/custom/a-bar/a-barrc" = "~/.a-barrc"
"config/custom/hammerspoon" = { target = "~/.hammerspoon", type = "symbolic", recurse = false }
"config/custom/launchagents/com.user.borders.plist" = { target = "~/Library/LaunchAgents/com.user.borders.plist", type = "template" }
"config/custom/launchagents/com.user.colima.plist" = { target = "~/Library/LaunchAgents/com.user.colima.plist", type = "template" }
"config/custom/launchagents/com.user.tmux.plist" = { target = "~/Library/LaunchAgents/com.user.tmux.plist", type = "template" }
"config/custom/launchagents/com.user.aerospace-restart.plist" = { target = "~/Library/LaunchAgents/com.user.aerospace-restart.plist", type = "template" }

# ─── Arch = base + linux + system files (/etc, root) ───
[arch]
depends = ["base", "linux"]

[arch.files]
"etc" = { target = "/etc", type = "template", owner = "root" }
